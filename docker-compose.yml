# Stack für Unraid. cloudflared läuft extern (eigener LXC) und erreicht die App über das LAN.
# Stack-Dateien (diese Datei + .env) liegen unter /mnt/user/appdata/family-dashboard/,
# die Daten in eigenen Shares direkt unter /mnt/user/. Vorlage für .env: .env.example.
services:
  family-dashboard:
    image: ghcr.io/1984ozone1984/kommandozentrale:latest
    container_name: family-dashboard
    restart: unless-stopped
    # Unraid-Standard nobody:users, damit die Shares wie gewohnt beschreibbar sind
    user: '99:100'
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - '${APP_PORT:-8470}:8470'
    volumes:
      - /mnt/user/family-dashboard:/data
    networks: [kz]

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    container_name: family-dashboard-mealie
    restart: unless-stopped
    environment:
      ALLOW_SIGNUP: 'false'
      # Dateien als nobody:users anlegen (Mealie-Standard wäre 911)
      PUID: '99'
      PGID: '100'
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /mnt/user/family-dashboard-mealie:/app/data
    # Port nur im LAN für die Rezeptpflege (nie über den Tunnel freigeben).
    # Die App selbst spricht Mealie intern unter http://family-dashboard-mealie:9000 an.
    ports:
      - '${MEALIE_PORT:-9925}:9000'
    networks: [kz]

networks:
  kz: {}
